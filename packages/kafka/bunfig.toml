[test]
timeout = 60000

# coverage runs via: bun test --coverage (or `bun run test:coverage`)
# helpers.ts is test scaffolding, not shipped code -> excluded from coverage.
# src/kafkajs-compat is a delegation shell over core: the mock-broker unit job
# can't drive it meaningfully, so it is validated end-to-end by test/impl
# (real brokers) and the vendored external suites instead
# (docs/compat-test-gap-audit.md tracks its own-suite gaps).
coverageThreshold = { lines = 0.80, functions = 0.72 }
coveragePathIgnorePatterns = ["test/helpers.ts", "src/kafkajs-compat/**"]
coverageReporter = ["text", "lcov"]
coverageDir = "out/coverage"
