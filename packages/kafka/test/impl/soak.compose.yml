name: bun-kafka-soak

services:
  redpanda:
    image: redpandadata/redpanda:v25.2.1
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --node-id=0
      - --smp=2
      - --memory=2G
      - --reserve-memory=0M
      - --overprovisioned
      - --check=false
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=127.0.0.1:19092
    ports: ["19092:9092"]
    volumes: ["redpanda:/var/lib/redpanda/data"]
    healthcheck:
      test: [CMD-SHELL, "rpk cluster health -X brokers=localhost:9092 >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redpanda:
