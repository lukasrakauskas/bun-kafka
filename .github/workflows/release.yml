name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs['packages/kafka--release_created'] }}
      tag: ${{ steps.release.outputs['packages/kafka--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    needs: release
    if: ${{ needs.release.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          version="$(bun -e 'console.log((await Bun.file("packages/kafka/package.json").json()).version)')"
          test "$RELEASE_TAG" = "v$version" || {
            echo "Release tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          }
      - name: Stage package on npm
        working-directory: packages/kafka
        run: bunx npm@12.0.2 stage publish --access public
