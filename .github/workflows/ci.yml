name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/kafka

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run lint
      - run: bun run format:check
      - run: bunx tsc --noEmit

  unit:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: .
      # threshold enforced via [test] coverageThreshold in bunfig.toml
      - run: bun run test:coverage

  impl:
    needs: static
    runs-on: ubuntu-latest
    env:
      KAFKA_BROKERS: 127.0.0.1:9092
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: .
      # HANDOFF.md dev-container recipe; a service container cannot override
      # CMD to pass `redpanda start --mode dev-container --advertise-kafka-addr`
      - name: Start Redpanda (single node)
        working-directory: .
        run: |
          docker run -d --name redpanda --ulimit nofile=65536:65536 -p 9092:9092 \
            redpandadata/redpanda:v24.3.7 \
            redpanda start --mode dev-container \
            --kafka-addr=PLAINTEXT://0.0.0.0:9092 \
            --advertise-kafka-addr=PLAINTEXT://127.0.0.1:9092
      - name: Wait for broker health
        working-directory: .
        run: |
          for i in $(seq 1 60); do
            docker exec redpanda rpk cluster health 2>/dev/null | grep -Eq 'Healthy:\s*true' && exit 0
            sleep 1
          done
          echo "Redpanda did not become healthy" >&2
          docker logs redpanda
          exit 1
      - name: Single-node internal topic replication factor + restart (HANDOFF.md)
        working-directory: .
        run: |
          docker exec redpanda rpk cluster config set internal_topic_replication_factor 1
          docker restart redpanda
          for i in $(seq 1 60); do
            docker exec redpanda rpk cluster health 2>/dev/null | grep -Eq 'Healthy:\s*true' && exit 0
            sleep 1
          done
          echo "Redpanda did not come back healthy after restart" >&2
          docker logs redpanda
          exit 1
      # gated suites self-skip without their env (chaos-cluster, TLS-external)
      - run: bun test test/impl

  kafka-4-consumer-groups:
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kafka: [4.0.2, 4.3.1]
    env:
      KAFKA_BROKERS: 127.0.0.1:9092
      KAFKA_KIP_848: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: Start Kafka ${{ matrix.kafka }}
        working-directory: .
        run: docker run -d --name kafka -p 9092:9092 apache/kafka:${{ matrix.kafka }}
      - name: Wait for Kafka
        working-directory: .
        run: |
          for i in $(seq 1 90); do
            docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs kafka
          exit 1
      - run: bun test test/impl/consumer-group-protocol-real.test.ts

  chaos-mock:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run test:chaos:mock

  docs:
    needs: static
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run build
